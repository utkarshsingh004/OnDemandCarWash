<div class="login-container">

  <div class="login-card">

    <h1>Green Car Wash</h1>

    <p class="subtitle">
      Login to your account
    </p>

    <form (ngSubmit)="login()">

      <div class="form-group">

        <label>Email</label>

        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Enter your email"
          required
        />

      </div>

      <div class="form-group">

        <label>Password</label>

        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Enter your password"
          required
        />

      </div>

      <div class="form-group">

        <label>Login As</label>

        <select
          name="role"
          [(ngModel)]="role"
        >

          <option value="Customer">
            Customer
          </option>

          <option value="Washer">
            Washer
          </option>

          <option value="Admin">
            Admin
          </option>

        </select>

      </div>

      @if (errorMessage) {
        <div class="error-message">
          {{ errorMessage }}
        </div>
      }

      <button
        type="submit"
        [disabled]="isLoading"
      >

        {{ isLoading ? 'Logging in...' : 'Login' }}

      </button>

    </form>

    <p class="register-text">

      Don't have an account?

      <a routerLink="/register">
        Register
      </a>

    </p>

  </div>

</div>
